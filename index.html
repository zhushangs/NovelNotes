<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>读后记</title>
  <meta name="theme-color" content="#F4EEE1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="读后记">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">读后记</a>
    <nav class="tabs">
      <a href="#/" data-tab="new">写新笔记</a>
      <a href="#/shelf" data-tab="shelf">书架</a>
      <a href="#/settings" data-tab="settings">设置</a>
    </nav>
  </header>

  <div id="localBanner" class="banner" hidden>本地模式：还没填 Supabase 配置，数据只保存在这个浏览器里，不会同步。</div>

  <main id="app"></main>

  <!-- Image export modal -->
  <div id="imgModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>生成图片</h2>
        <button class="icon-btn" data-close aria-label="关闭">✕</button>
      </div>
      <div class="img-opts">
        <div class="seg" id="optMode">
          <button data-v="portrait">3:4 竖版</button>
          <button data-v="long">长图</button>
        </div>
        <div class="seg" id="optTheme">
          <button data-v="paper">宣纸</button>
          <button data-v="ink">夜墨</button>
          <button data-v="celadon">青瓷</button>
        </div>
        <label class="check"><input type="checkbox" id="optIndent"> 段首缩进</label>
      </div>
      <p id="imgHint" class="hint"></p>
      <div id="imgPreview" class="img-preview"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="btnShare" hidden>分享 / 存到相册</button>
        <button class="btn primary" id="btnDownload">下载图片</button>
      </div>
    </div>
  </div>

  <!-- Sync conflict modal -->
  <div id="conflictModal" class="modal" hidden>
    <div class="modal-card narrow">
      <div class="modal-head"><h2>另一台设备刚改过这篇笔记</h2></div>
      <p class="hint">云端的版本比你这里打开时更新。要怎么处理？</p>
      <div class="conflict-cmp">
        <div><h3>云端版本</h3><pre id="cfServer"></pre></div>
        <div><h3>这台设备</h3><pre id="cfLocal"></pre></div>
      </div>
      <div class="modal-actions stack">
        <button class="btn primary" data-choice="append">两份都留（把这里写的接到云端后面）</button>
        <button class="btn ghost" data-choice="server">用云端版本</button>
        <button class="btn ghost" data-choice="local">用这台设备的版本覆盖</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
